networks:
  default:
    external: true
    name: sida-edge-net

services:
  sida-ingestion:
    build:
      context: ./core/sida-ingestion
      dockerfile: Dockerfile
    container_name: sida-ingestion
    volumes:
      - sida_ipc:/tmp/.ipc
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - sida-core
    restart: unless-stopped

  sida-core:
    build: ./sida-core  
    container_name: sida-core
    ports:
      - "8000:8000"
    volumes:
      - ./sida-core/data:/app/data
      - sida_ipc:/tmp/.ipc
    restart: unless-stopped
  
  sida-context:
    build:
      context: .
      dockerfile: ./core/Dockerfile
      args:
        - PROJECT_DIR=./core/context
    container_name: sida-poc-context
    environment:
      - TZ=America/Recife
      - FLOWS=flows.json
    ports:
      - "1881:1880"
    volumes:
      - ./core/context:/data
      - sida_ipc:/tmp/.ipc
    restart: unless-stopped
    depends_on:
      - sida-core
    attach: false

  sida-delivery:
    build:
      context: .
      dockerfile: ./core/Dockerfile
      args:
        - PROJECT_DIR=./core/delivery
    container_name: sida-poc-delivery
    environment:
      - TZ=America/Recife
      - FLOWS=flows.json
    ports:
      - "1882:1880"
    volumes:
      - ./core/delivery:/data
      - sida_ipc:/tmp/.ipc
    restart: unless-stopped
    depends_on:
      - sida-core
    attach: false

volumes:
  sida_ipc: