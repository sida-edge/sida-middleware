server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve ES modules and .proto with correct handling; no caching of config.js
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    types {
        application/javascript js mjs;
        text/plain             proto;
        text/css               css;
        text/html              html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
